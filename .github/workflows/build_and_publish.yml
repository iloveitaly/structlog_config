name: Build and Publish to PyPI
on:
  push:
    branches:
      - main
      - master
  pull_request: {}

permissions:
  contents: write

env:
  PIP_DEFAULT_TIMEOUT: 60
  PIP_RETRIES: 5

  # required otherwise github api calls are rate limited
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_ENV: ci

jobs:
  matrix-test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14", "3.13", "3.12", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.2.5
      - run: mise use python@${{ matrix.python-version }}
      - uses: iloveitaly/github-action-direnv-load-and-mask@master

      - name: Install dependencies (minimal)
        run: uv sync

      - name: Run tests (minimal)
        run: uv run pytest

      - name: Install dependencies (full)
        run: uv sync --all-groups --all-extras

      - name: Run tests (full)
        run: uv run pytest

  release-please:
    needs: matrix-test
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    permissions:
      contents: write
      issues: write
      # NOTE this permission requires configuration to be set on the repo, check `just github_repo_permissions_create`
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: python

  build-and-publish:
    needs: release-please
    runs-on: ubuntu-latest
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.2.5
      - uses: iloveitaly/github-action-direnv-load-and-mask@master
      - run: uv sync
      - run: uv build
      - run: uv publish
